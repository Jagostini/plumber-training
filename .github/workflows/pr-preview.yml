name: PR preview

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: 
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Preview
        run: echo "Preview ready for PR ${{ github.event.pull_request.number }}"
